<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ethereum Power Law Regression — Log/Log</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<link rel="stylesheet" href="assets/crypto-power-law.css" />
</head>
<body>

<header>
  <h1>Ethereum Power Law Regression <small>log–log модель · справедливая стоимость и канал по экстремумам</small></h1>
  <div class="stats">
    <div class="stat"><div class="label">Цена ETH</div><div id="stat-price" class="value accent">—</div></div>
    <div class="stat"><div class="label">Fair Value</div><div id="stat-fair" class="value">—</div></div>
    <div class="stat"><div class="label">Отклонение</div><div id="stat-dev" class="value">—</div></div>
    <div class="stat"><div class="label">Положение в канале</div><div id="stat-pos" class="value">—</div></div>
  </div>
</header>

<div class="controls">
  <label>Ось X:
    <select id="x-mode">
      <option value="date" selected>Дата (log y)</option>
      <option value="loglog">Дни от genesis (log x · log y)</option>
    </select>
  </label>
  <div class="sep"></div>
  <button id="btn-channels" class="active">Канал экстремумов</button>
  <button id="btn-quantile">Квантильный канал (5%/95%)</button>
  <button id="btn-points" class="active">Точки цены</button>
  <div class="sep"></div>
  <label>Базовая дата:
    <select id="basis">
      <option value="genesis" selected>Genesis (2015-07-30)</option>
      <option value="first">Первая цена (2015-08-07)</option>
    </select>
  </label>
  <div class="sep"></div>
  <span class="cross-link">→ <a href="bitcoin-power-law.html">Bitcoin</a></span>
  <div class="sep"></div>
  <span id="status" class="status-loading">Инициализация…</span>
</div>

<div id="chart"></div>

<footer>
  <div>
    Модель: <span class="formula">log₁₀(price) = a + b · log₁₀(days)</span>
    · <span id="model-coef">a = —, b = —</span>
  </div>
  <div>Источник данных: <span id="data-source">—</span></div>
</footer>

<script>
window.CRYPTO_PL_CONFIG = {
  symbol: "ETH",
  name: "Ethereum",
  accent: "#627eea",
  // Дата создания genesis-блока Ethereum: 30 июля 2015
  genesis: "2015-07-30",
  // Первая рыночная цена на биржах ~7 августа 2015
  firstPrice: "2015-08-07",
  // Минимальный embedded fallback (годовые точки на конец года).
  embedded: [
    ["2015-08-07", 2.77], ["2015-12-31", 0.93], ["2016-12-31", 8.30],
    ["2017-12-31", 756.0], ["2018-12-31", 133.0], ["2019-12-31", 130.0],
    ["2020-12-31", 738.0], ["2021-12-31", 3683.0], ["2022-12-31", 1196.0],
    ["2023-12-31", 2294.0], ["2024-12-31", 3337.0], ["2025-04-30", 1797.0]
  ],
};
</script>
<script src="assets/crypto-power-law.js"></script>
</body>
</html>
