<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bitcoin Power Law Regression — Log/Log</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --panel-2: #1c2330;
    --border: #30363d;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --accent: #f7931a;
    --green: #3fb950;
    --red: #f85149;
    --blue: #58a6ff;
    --yellow: #d29922;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh;
  }
  header {
    padding: 18px 24px;
    border-bottom: 1px solid var(--border);
    display: flex; flex-wrap: wrap; align-items: center; gap: 24px;
    background: var(--panel);
  }
  header h1 {
    margin: 0; font-size: 18px; font-weight: 600;
    color: var(--accent); letter-spacing: 0.3px;
  }
  header h1 small { color: var(--text-dim); font-weight: 400; margin-left: 8px; font-size: 13px; }
  .stats { display: flex; flex-wrap: wrap; gap: 12px; margin-left: auto; }
  .stat {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 14px; min-width: 130px;
  }
  .stat .label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; }
  .stat .value { font-size: 17px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .stat .value.green { color: var(--green); }
  .stat .value.red { color: var(--red); }
  .stat .value.accent { color: var(--accent); }

  .controls {
    padding: 12px 24px; border-bottom: 1px solid var(--border);
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: var(--panel);
  }
  .controls label { font-size: 12px; color: var(--text-dim); display: inline-flex; align-items: center; gap: 6px; user-select: none; }
  .controls button, .controls select {
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); padding: 6px 12px; border-radius: 6px;
    cursor: pointer; font-size: 12px; transition: background 0.15s, border-color 0.15s;
  }
  .controls button:hover, .controls select:hover { border-color: var(--accent); }
  .controls button.active { background: var(--accent); color: #000; border-color: var(--accent); }
  .controls .sep { width: 1px; height: 22px; background: var(--border); margin: 0 4px; }

  #chart { width: 100%; height: calc(100vh - 230px); min-height: 500px; position: relative; }
  #chart .placeholder {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--text-dim); font-size: 14px; text-align: center; padding: 20px;
  }
  #chart .placeholder.error { color: var(--red); }

  footer {
    padding: 10px 24px; border-top: 1px solid var(--border);
    color: var(--text-dim); font-size: 11px; background: var(--panel);
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px;
  }
  .formula { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--blue); }
  .status-loading { color: var(--yellow); }
  .status-ok { color: var(--green); }
  .status-fail { color: var(--red); }
  .cross-link a { color: var(--blue); text-decoration: none; }
  .cross-link a:hover { text-decoration: underline; }
</style>
</head>
<body>

<header>
  <h1>Bitcoin Power Law Regression <small>log–log модель · справедливая стоимость и канал по экстремумам</small></h1>
  <div class="stats">
    <div class="stat"><div class="label">Цена BTC</div><div id="stat-price" class="value accent">—</div></div>
    <div class="stat"><div class="label">Fair Value</div><div id="stat-fair" class="value">—</div></div>
    <div class="stat"><div class="label">Отклонение</div><div id="stat-dev" class="value">—</div></div>
    <div class="stat"><div class="label">Положение в канале</div><div id="stat-pos" class="value">—</div></div>
  </div>
</header>

<div class="controls">
  <label>Ось X:
    <select id="x-mode">
      <option value="date" selected>Дата (log y)</option>
      <option value="loglog">Дни от genesis (log x · log y)</option>
    </select>
  </label>
  <div class="sep"></div>
  <button id="btn-channels" class="active">Канал экстремумов</button>
  <button id="btn-quantile">Квантильный канал (5%/95%)</button>
  <button id="btn-points" class="active">Точки цены</button>
  <div class="sep"></div>
  <label>Базовая дата:
    <select id="basis">
      <option value="genesis" selected>Genesis (2009-01-03)</option>
      <option value="first">Первая цена (2010-07-17)</option>
    </select>
  </label>
  <div class="sep"></div>
  <span class="cross-link">→ <a href="ethereum-power-law.html">Ethereum</a></span>
  <div class="sep"></div>
  <span id="status" class="status-loading">Инициализация…</span>
</div>

<div id="chart"><div class="placeholder" id="ph">Загружаем библиотеку графиков…</div></div>

<footer>
  <div>
    Модель: <span class="formula">log₁₀(price) = a + b · log₁₀(days)</span>
    · <span id="model-coef">a = —, b = —</span>
  </div>
  <div>Источник данных: <span id="data-source">—</span></div>
</footer>

<script>
"use strict";

const CFG = {
  symbol: "BTC",
  name: "Bitcoin",
  accent: "#f7931a",
  genesis: "2009-01-03",
  firstPrice: "2010-07-17",
  embedded: [
    ["2010-07-17", 0.05], ["2010-12-31", 0.30], ["2011-06-30", 16.0],
    ["2011-12-31", 4.7], ["2012-12-31", 13.5], ["2013-12-31", 758.0],
    ["2014-12-31", 320.0], ["2015-12-31", 430.0], ["2016-12-31", 963.0],
    ["2017-12-31", 14156.0], ["2018-12-31", 3742.0], ["2019-12-31", 7193.0],
    ["2020-12-31", 28990.0], ["2021-12-31", 46220.0], ["2022-12-31", 16550.0],
    ["2023-12-31", 42270.0], ["2024-12-31", 93420.0], ["2025-04-30", 94210.0]
  ],
};

document.documentElement.style.setProperty("--accent", CFG.accent);

const GENESIS = new Date(CFG.genesis + "T00:00:00Z");
const FIRST_PRICE_DATE = new Date(CFG.firstPrice + "T00:00:00Z");
const MS_PER_DAY = 86400000;

let basisDate = GENESIS;
const daysSinceBasis = d => (d.getTime() - basisDate.getTime()) / MS_PER_DAY;

function fitPowerLaw(pts) {
  const xs = [], ys = [];
  for (const p of pts) {
    const days = daysSinceBasis(p.date);
    if (days <= 0 || p.price <= 0) continue;
    xs.push(Math.log10(days)); ys.push(Math.log10(p.price));
  }
  const n = xs.length;
  const mx = xs.reduce((a, b) => a + b, 0) / n;
  const my = ys.reduce((a, b) => a + b, 0) / n;
  let num = 0, den = 0;
  for (let i = 0; i < n; i++) { num += (xs[i] - mx) * (ys[i] - my); den += (xs[i] - mx) ** 2; }
  const b = num / den, a = my - b * mx;
  const residuals = xs.map((x, i) => ys[i] - (a + b * x));
  let ssRes = 0, ssTot = 0;
  for (let i = 0; i < n; i++) { ssRes += residuals[i] ** 2; ssTot += (ys[i] - my) ** 2; }
  return { a, b, residuals, xs, ys, r2: 1 - ssRes / ssTot, n };
}
function quantile(arr, q) {
  const s = [...arr].sort((x, y) => x - y);
  const pos = (s.length - 1) * q, lo = Math.floor(pos), hi = Math.ceil(pos);
  return lo === hi ? s[lo] : s[lo] + (s[hi] - s[lo]) * (pos - lo);
}

let points = CFG.embedded.map(([d, p]) => ({ date: new Date(d + "T00:00:00Z"), price: p }));
let model = null, extremes = null, quantiles = null;
let dataSource = "embedded (" + points.length + " pts)";

const SHOW = { extremes: true, quantile: false, points: true, mode: "date" };

function recompute() {
  model = fitPowerLaw(points);
  const r = model.residuals;
  extremes = { upper: Math.max(...r), lower: Math.min(...r) };
  quantiles = { upper: quantile(r, 0.95), lower: quantile(r, 0.05) };
  document.getElementById("model-coef").textContent =
    `a = ${model.a.toFixed(4)}, b = ${model.b.toFixed(4)} · R² = ${model.r2.toFixed(4)} · n = ${model.n}`;
}
const fairValue = d => {
  const days = daysSinceBasis(d);
  return days <= 0 ? NaN : Math.pow(10, model.a + model.b * Math.log10(days));
};
const channelAt = (d, dev) => fairValue(d) * Math.pow(10, dev);

function hexToRgba(hex, a) {
  const h = hex.replace("#", "");
  return `rgba(${parseInt(h.slice(0,2),16)},${parseInt(h.slice(2,4),16)},${parseInt(h.slice(4,6),16)},${a})`;
}

function buildTraces() {
  const lastDate = points[points.length - 1].date;
  const horizon = new Date(lastDate.getTime() + 5 * 365 * MS_PER_DAY);
  const startDate = new Date(GENESIS.getTime() + 200 * MS_PER_DAY);
  const grid = [];
  for (let t = startDate.getTime(); t <= horizon.getTime(); t += 10 * MS_PER_DAY) grid.push(new Date(t));
  const fair = grid.map(fairValue);
  const upE = grid.map(d => channelAt(d, extremes.upper));
  const lowE = grid.map(d => channelAt(d, extremes.lower));
  const upQ = grid.map(d => channelAt(d, quantiles.upper));
  const lowQ = grid.map(d => channelAt(d, quantiles.lower));
  const xPts = SHOW.mode === "date" ? points.map(p => p.date) : points.map(p => daysSinceBasis(p.date));
  const xG = SHOW.mode === "date" ? grid : grid.map(daysSinceBasis);
  const traces = [];
  if (SHOW.extremes) {
    traces.push({ x: xG, y: upE, name: "Верх канала (экстремум)", mode: "lines",
      line: { color: "#f85149", width: 1.5, dash: "dot" }, hovertemplate: "Верх (экстр.): $%{y:,.0f}<extra></extra>" });
    traces.push({ x: xG, y: lowE, name: "Низ канала (экстремум)", mode: "lines",
      line: { color: "#3fb950", width: 1.5, dash: "dot" }, fill: "tonexty",
      fillcolor: hexToRgba(CFG.accent, 0.04), hovertemplate: "Низ (экстр.): $%{y:,.0f}<extra></extra>" });
  }
  if (SHOW.quantile) {
    traces.push({ x: xG, y: upQ, name: "95-й квантиль", mode: "lines",
      line: { color: "#d29922", width: 1, dash: "dash" }, hovertemplate: "95%: $%{y:,.0f}<extra></extra>" });
    traces.push({ x: xG, y: lowQ, name: "5-й квантиль", mode: "lines",
      line: { color: "#58a6ff", width: 1, dash: "dash" }, hovertemplate: "5%: $%{y:,.0f}<extra></extra>" });
  }
  traces.push({ x: xG, y: fair, name: "Fair Value (регрессия)", mode: "lines",
    line: { color: CFG.accent, width: 2.5 }, hovertemplate: "Fair: $%{y:,.2f}<extra></extra>" });
  if (SHOW.points) {
    traces.push({ x: xPts, y: points.map(p => p.price), name: CFG.symbol + " цена", mode: "lines",
      line: { color: "#58a6ff", width: 1.2 },
      hovertemplate: SHOW.mode === "date"
        ? "%{x|%Y-%m-%d}<br>" + CFG.symbol + ": $%{y:,.2f}<extra></extra>"
        : "День %{x:.0f}<br>" + CFG.symbol + ": $%{y:,.2f}<extra></extra>" });
  }
  return traces;
}
function buildLayout() {
  const isLL = SHOW.mode === "loglog";
  return {
    paper_bgcolor: "#0d1117", plot_bgcolor: "#0d1117",
    font: { color: "#e6edf3", family: "ui-monospace, SFMono-Regular, Menlo, monospace", size: 12 },
    margin: { l: 70, r: 20, t: 20, b: 50 },
    showlegend: true,
    legend: { orientation: "h", x: 0, y: 1.06, bgcolor: "rgba(22,27,34,0.6)", bordercolor: "#30363d", borderwidth: 1 },
    hovermode: "x unified",
    xaxis: {
      title: isLL ? "Дней от " + (basisDate === GENESIS ? "Genesis" : "первой цены") + " (log)" : "Дата",
      type: isLL ? "log" : "date",
      gridcolor: "#21262d", zerolinecolor: "#30363d", tickfont: { color: "#8b949e" },
    },
    yaxis: {
      title: "Цена " + CFG.symbol + " (USD, log)", type: "log",
      gridcolor: "#21262d", zerolinecolor: "#30363d", tickfont: { color: "#8b949e" }, tickformat: "$,",
    },
  };
}

function render() {
  if (typeof Plotly === "undefined") return;
  const ph = document.getElementById("ph");
  if (ph) ph.remove();
  try {
    Plotly.react("chart", buildTraces(), buildLayout(),
      { responsive: true, displaylogo: false, modeBarButtonsToRemove: ["lasso2d", "select2d"] });
  } catch (e) {
    console.error("Plotly render error:", e);
  }
  updateStats();
}

function fmt(n) {
  if (!isFinite(n)) return "—";
  if (n >= 1000) return n.toLocaleString("en-US", { maximumFractionDigits: 0 });
  if (n >= 1) return n.toFixed(2);
  return n.toFixed(4);
}

function updateStats() {
  const last = points[points.length - 1];
  const today = new Date();
  const fairToday = fairValue(today);
  const dev = last.price / fairValue(last.date) - 1;
  const upE = channelAt(today, extremes.upper);
  const lowE = channelAt(today, extremes.lower);
  const pos = ((Math.log10(last.price) - Math.log10(lowE)) / (Math.log10(upE) - Math.log10(lowE))) * 100;
  document.getElementById("stat-price").textContent = "$" + fmt(last.price);
  document.getElementById("stat-fair").textContent = "$" + fmt(fairToday);
  const devEl = document.getElementById("stat-dev");
  devEl.textContent = (dev >= 0 ? "+" : "") + (dev * 100).toFixed(1) + "%";
  devEl.className = "value " + (dev >= 0 ? "green" : "red");
  const posEl = document.getElementById("stat-pos");
  posEl.textContent = isFinite(pos) ? pos.toFixed(0) + "%" : "—";
  posEl.className = "value " + (pos > 80 ? "red" : pos < 20 ? "green" : "");
}

// =========== Plotly loader with multi-CDN fallback =================
function loadPlotly() {
  const CDNS = [
    "https://cdn.plot.ly/plotly-2.35.2.min.js",
    "https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js",
    "https://unpkg.com/plotly.js-dist-min@2.35.2/plotly.min.js",
  ];
  return new Promise((resolve, reject) => {
    let i = 0;
    const tryNext = () => {
      if (typeof Plotly !== "undefined") return resolve();
      if (i >= CDNS.length) return reject(new Error("все CDN не отвечают"));
      const s = document.createElement("script");
      s.src = CDNS[i++];
      s.async = true;
      s.onload = () => typeof Plotly !== "undefined" ? resolve() : tryNext();
      s.onerror = () => tryNext();
      document.head.appendChild(s);
    };
    tryNext();
  });
}

// =========== Data sources ============================================
async function loadHistory() {
  const status = document.getElementById("status");
  status.textContent = "Грузим полную ежедневную историю из CryptoCompare…";
  status.className = "status-loading";
  try {
    const url = `https://min-api.cryptocompare.com/data/v2/histoday?fsym=${CFG.symbol}&tsym=USD&allData=true`;
    const r = await fetch(url, { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    const arr = j && j.Data && j.Data.Data;
    if (!Array.isArray(arr) || arr.length === 0) throw new Error("empty payload");
    const fresh = arr.filter(x => x.close > 0).map(x => ({ date: new Date(x.time * 1000), price: x.close }));
    if (fresh.length < 100) throw new Error("too few points: " + fresh.length);
    points = fresh;
    dataSource = "CryptoCompare (daily, " + fresh.length + " pts)";
    status.textContent = "✓ Загружено " + fresh.length + " дневных точек с CryptoCompare.";
    status.className = "status-ok";
  } catch (e) {
    console.warn("history fetch failed:", e);
    status.textContent = "Не удалось загрузить онлайн-историю (" + e.message + "). Используется встроенная.";
    status.className = "status-fail";
  }
  document.getElementById("data-source").textContent = dataSource;
}
async function fetchSpot() {
  try {
    const r = await fetch(`https://min-api.cryptocompare.com/data/price?fsym=${CFG.symbol}&tsyms=USD`, { cache: "no-store" });
    if (!r.ok) return;
    const j = await r.json();
    if (j && j.USD > 0) {
      const today = new Date(); today.setUTCHours(0, 0, 0, 0);
      const last = points[points.length - 1];
      if ((today - last.date) / MS_PER_DAY > 0.5) points.push({ date: today, price: j.USD });
      else points[points.length - 1] = { date: today, price: j.USD };
    }
  } catch (e) { /* ignore */ }
}

// =========== UI handlers ============================================
function bindUI() {
  document.getElementById("btn-channels").addEventListener("click", function () {
    SHOW.extremes = !SHOW.extremes; this.classList.toggle("active", SHOW.extremes); render();
  });
  document.getElementById("btn-quantile").addEventListener("click", function () {
    SHOW.quantile = !SHOW.quantile; this.classList.toggle("active", SHOW.quantile); render();
  });
  document.getElementById("btn-points").addEventListener("click", function () {
    SHOW.points = !SHOW.points; this.classList.toggle("active", SHOW.points); render();
  });
  document.getElementById("x-mode").addEventListener("change", function () { SHOW.mode = this.value; render(); });
  document.getElementById("basis").addEventListener("change", function () {
    basisDate = this.value === "genesis" ? GENESIS : FIRST_PRICE_DATE; recompute(); render();
  });
}

// =========== Init ===================================================
(async function () {
  const ph = document.getElementById("ph");
  bindUI();
  recompute();
  document.getElementById("data-source").textContent = dataSource;
  try {
    await loadPlotly();
  } catch (e) {
    if (ph) { ph.textContent = "Не удалось загрузить Plotly: " + e.message + ". Проверь интернет / отключи блокировщики."; ph.classList.add("error"); }
    document.getElementById("status").textContent = "✗ Plotly не загрузился";
    document.getElementById("status").className = "status-fail";
    return;
  }
  render(); // что-то показать сразу из embedded
  await loadHistory();
  await fetchSpot();
  recompute();
  render();
})();
</script>
</body>
</html>
